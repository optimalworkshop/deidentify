name: Deidentify

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
    - name: Install dependencies
      run: bundle install
    - name: Run tests
      run: bundle exec rake spec
    - name: Run linter
      run: bundle exec rubocop
